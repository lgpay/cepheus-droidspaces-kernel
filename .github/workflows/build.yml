name: Build cepheus Droidspaces kernel

# Builds the cepheus (Mi 9) Droidspaces kernel from the InfiniR source tree,
# applies the close_range() fix, and packages an AnyKernel3 flashable zip.
#
# Reproducibility: source commit, KSU-Next commit and .config are all pinned.
#
# Two hard-won rules baked into this workflow:
#  1. KernelSU-Next MUST be fetched as a real git checkout. Its Makefile
#     derives the embedded version string/code from git; the old tarball
#     fetch silently produced a kernel with no "v3.0.1-legacy" string.
#     The "Verify built image" step below is the regression gate for that.
#  2. The toolchain is clang r547379 — the one the flash-verified local
#     v5/v6 builds used. No silent fallback to a different clang.

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'raystef66/kernel_xiaomi_cepheus branch'
        default: '16.0-ksun'
        required: true
      expected_commit:
        description: 'Expected branch head (reproducibility guard)'
        default: '6ad047b70d809d7dee1fc090dbe2c252ff43b7eb'
        required: true
      ksu_ref:
        description: 'KernelSU-Next ref to check out'
        default: '00cb93e0bc8bf3ca3680c7e8a3d7cf11d0b59071'
        required: true
      artifact_name:
        description: 'Output zip filename'
        default: 'cepheus-crDroid-Droidspaces-v6.zip'
        required: true
      release_tag:
        description: 'Release tag to create or update'
        default: 'v6'
        required: true
      release_title:
        description: 'Release title'
        default: 'v6 — cepheus Droidspaces kernel (crDroid 16)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            libyaml-dev pkg-config \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 zip unzip xz-utils cpio rsync lz4 zstd

      - name: Fetch kernel source
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "${{ inputs.kernel_branch }}" \
            https://github.com/raystef66/kernel_xiaomi_cepheus.git "$RUNNER_TEMP/kernel"
          cd "$RUNNER_TEMP/kernel"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "kernel HEAD: $HEAD_SHA"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          if [ "$HEAD_SHA" != "${{ inputs.expected_commit }}" ]; then
            echo "::error::branch head $HEAD_SHA does not match expected ${{ inputs.expected_commit }}; upstream moved. Re-verify before building."
            exit 1
          fi
          head -5 Makefile

      - name: Fetch KernelSU-Next at pinned commit
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kernel"
          rm -rf KernelSU-Next
          # Full git clone, NOT a tarball: KernelSU-Next's Makefile derives its
          # version (string + code) from git describe / rev-list. A tarball has
          # no .git, which silently produced a kernel whose image contained no
          # "v3.0.1-legacy" string and an unverifiable version code.
          # (The "unable to read tree" failure only affects filtered/partial
          # clones; a plain full clone checks out the pinned SHA fine.)
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next checkout "${{ inputs.ksu_ref }}"
          KSU_HEAD="$(git -C KernelSU-Next rev-parse HEAD)"
          if [ "$KSU_HEAD" != "${{ inputs.ksu_ref }}" ]; then
            echo "::error::KernelSU-Next HEAD $KSU_HEAD != pinned ${{ inputs.ksu_ref }}"
            exit 1
          fi
          DESCRIBE="$(git -C KernelSU-Next describe --tags)"
          echo "KernelSU-Next describe: $DESCRIBE"
          if [ "${{ inputs.ksu_ref }}" = "00cb93e0bc8bf3ca3680c7e8a3d7cf11d0b59071" ] && [ "$DESCRIBE" != "v3.0.1-legacy-88-g00cb93e0" ]; then
            echo "::error::unexpected KernelSU-Next describe: $DESCRIBE (expected v3.0.1-legacy-88-g00cb93e0)"
            exit 1
          fi
          test -f KernelSU-Next/kernel/Kconfig || {
            echo "::error::KernelSU-Next/kernel/Kconfig missing"
            ls -la KernelSU-Next
            exit 1
          }
          echo "KSU-Next @ $KSU_HEAD ready:"
          ls KernelSU-Next | head -20

      - name: Apply close_range() fix
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-kernel-fixes.py" "$RUNNER_TEMP/kernel"

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kernel"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/cepheus-crDroid-Droidspaces-v5-config.txt" out/.config
          make ARCH=arm64 SUBARCH=arm64 O=out olddefconfig
          echo "--- sanity checks (hard fail) ---"
          fail=0
          for k in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_SUSFS \
                   CONFIG_CFS_BANDWIDTH CONFIG_POSIX_MQUEUE \
                   CONFIG_MACH_XIAOMI_CEPHEUS CONFIG_OVERLAY_FS; do
            if ! grep -q "^${k}=y" out/.config; then
              echo "::error::$k is not =y in final .config"
              fail=1
            fi
          done
          if ! grep -q '^# CONFIG_SCHED_WALT is not set' out/.config; then
            echo "::error::CONFIG_SCHED_WALT must be off"
            fail=1
          fi
          if ! grep -q '^CONFIG_LOCALVERSION="-Droidspaces"' out/.config; then
            echo "::error::CONFIG_LOCALVERSION is not \"-Droidspaces\""
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "config checks passed"

      - name: Download clang toolchain
        run: |
          set -euo pipefail
          TC="$RUNNER_TEMP/clang"
          mkdir -p "$TC"
          cd "$TC"
          # clang r547379: the toolchain the flash-verified local v5/v6 builds
          # used (Android clang 20.0.0). If this download fails, the run must
          # fail loudly — do NOT fall back to a different clang version.
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-release/clang-r547379.tar.gz"
          echo "downloading $URL"
          curl -fsSL --retry 4 --retry-delay 5 --connect-timeout 25 -o clang.tar.gz "$URL" || {
            echo "::error::clang r547379 download failed; refusing to build with a different toolchain"
            exit 1
          }
          tar -xzf clang.tar.gz -C .
          rm -f clang.tar.gz
          ./bin/clang --version | tee /tmp/clang-version.txt
          grep -q 'r547379' /tmp/clang-version.txt || {
            echo "::error::downloaded toolchain is not clang r547379"
            exit 1
          }

      - name: Build kernel
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kernel"
          export ARCH=arm64 SUBARCH=arm64
          export PATH="$RUNNER_TEMP/clang/bin:$PATH"
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          set +e
          # HOSTLOADLIBES_dtc is the variable THIS tree's scripts/Makefile.host
          # actually expands (4.14 era); the newer HOSTLDLIBS_dtc name is
          # ignored here. Without it, yamltree.o is linked but -lyaml is not,
          # and lld fails with "undefined symbol: yaml_*_initialize".
          make -j"$(nproc)" O=out \
            CC=clang AR=llvm-ar LD=ld.lld NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTLOADLIBES_dtc=-lyaml \
            Image.gz-dtb > "$RUNNER_TEMP/build.log" 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "=== BUILD FAILED (rc=$RC) - last 200 lines ==="
            tail -n 200 "$RUNNER_TEMP/build.log"
            echo "=== grep errors ==="
            grep -nE "error:|Error [0-9]|No rule to make" "$RUNNER_TEMP/build.log" | tail -n 40 || true
            exit $RC
          fi
          echo "=== build ok, tail of log ==="
          tail -n 15 "$RUNNER_TEMP/build.log"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Verify built image
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kernel"
          zcat out/arch/arm64/boot/Image.gz-dtb > /tmp/Image.raw || true
          test -s /tmp/Image.raw || { echo "::error::could not decompress built image"; exit 1; }
          echo "--- kernel release string ---"
          strings /tmp/Image.raw | grep -m1 'Linux version'
          strings /tmp/Image.raw | grep -q '4.14.355-openela-Droidspaces' || {
            echo "::error::kernel release string 4.14.355-openela-Droidspaces not found"
            exit 1
          }
          echo "--- KernelSU embedded version string (regression gate) ---"
          if ! strings /tmp/Image.raw | grep -q 'v3.0.1-legacy'; then
            echo "::error::KernelSU version string 'v3.0.1-legacy' not found in image."
            echo "::error::This is the tarball-fetch failure mode: KSU must be a real git checkout."
            exit 1
          fi
          echo "--- ikconfig key symbols ---"
          scripts/extract-ikconfig /tmp/Image.raw > /tmp/ikconfig.txt
          for k in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_SUSFS \
                   CONFIG_POSIX_MQUEUE CONFIG_CFS_BANDWIDTH \
                   CONFIG_MACH_XIAOMI_CEPHEUS CONFIG_OVERLAY_FS; do
            grep -q "^${k}=y" /tmp/ikconfig.txt || {
              echo "::error::ikconfig: $k is not =y"
              exit 1
            }
          done
          grep -q '^# CONFIG_SCHED_WALT is not set' /tmp/ikconfig.txt || {
            echo "::error::ikconfig: CONFIG_SCHED_WALT must be off"
            exit 1
          }
          grep -q '^CONFIG_LOCALVERSION="-Droidspaces"' /tmp/ikconfig.txt || {
            echo "::error::ikconfig: CONFIG_LOCALVERSION mismatch"
            exit 1
          }
          echo "--- close_range() patch anchor in source tree ---"
          test "$(grep -c 'max_fd = min(last_fd(files_fdtable(cur_fds)), max_fd)' fs/file.c)" = "1" || {
            echo "::error::close_range clamp anchor not found exactly once in fs/file.c"
            exit 1
          }
          echo "all verification gates passed"

      - name: Package AnyKernel3 zip
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kernel"
          cp out/.config "$GITHUB_WORKSPACE/build-config.txt"

          rm -rf "$RUNNER_TEMP/ak3"
          cp -r "$GITHUB_WORKSPACE/ak3" "$RUNNER_TEMP/ak3"
          cp out/arch/arm64/boot/Image.gz-dtb "$RUNNER_TEMP/ak3/"

          cd "$RUNNER_TEMP/ak3"
          # Recovery banner: fixed wording tied to the release tag, so it
          # matches the locally built packages (no artifact-name leakage).
          sed -i "s|^kernel.string=.*|kernel.string=cepheus Droidspaces ${{ inputs.release_tag }} (close_range fix) 4.14.355-openela-Droidspaces|" anykernel.sh
          grep -m1 '^kernel.string=' anykernel.sh

          ZIPPATH="$RUNNER_TEMP/${{ inputs.artifact_name }}"
          zip -r9 "$ZIPPATH" . -x '*.zip' > /dev/null
          ls -lh "$ZIPPATH"
          sha256sum "$ZIPPATH" | tee "$RUNNER_TEMP/SHA256SUMS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: |
            ${{ runner.temp }}/${{ inputs.artifact_name }}
            ${{ runner.temp }}/SHA256SUMS
            build-config.txt
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_title }}
          body: |
            Built from raystef66/kernel_xiaomi_cepheus @ ${{ env.HEAD_SHA }} (branch ${{ inputs.kernel_branch }})
            KernelSU-Next @ ${{ inputs.ksu_ref }} — real git checkout; embedded version string v3.0.1-legacy-88 verified in CI before packaging.
            Toolchain: AOSP clang r547379 (same as the flash-verified local builds).

            Includes the `close_range()` fd-table clamp fix (`fs/file.c`, +5 lines — see PATCH_NOTES.md and BUILD-v6.md). Config is identical to v5: namespaces, CFS_BANDWIDTH (--cpus), POSIX_MQUEUE, OVERLAY_FS, SCHED_WALT off, BBR. Kernel release string: `4.14.355-openela-Droidspaces`.

            ⚠️ Back up your boot partition before flashing. cepheus + crDroid 16 only.
          files: |
            ${{ runner.temp }}/${{ inputs.artifact_name }}
            ${{ runner.temp }}/SHA256SUMS
          fail_on_unmatched_files: true
